<header><h1>하나님의 것은 하나님께</h1><p>2026년 10월 18일 (주일) · 기독교대한감리회 지석교회 · 마태복음 22:15-22</p></header>

<script>
const nodes=[{"id":"c","label":"하나님의 것은 하나님께","sub":"마태복음 22:15-22","x":0,"y":0,"r":0,"color":"#1B3A6B","detail":"<p><b>내 안에 새겨진 하나님의 형상을 따라 사는 성도</b></p><p>2026년 10월 18일 (주일) · 성령강림 후 제21주 · 공동성서정과 A년 (Proper 24) · 절기색 초록</p><p>마태복음 22:15-22<br>출애굽기 33:12-23 · 시편 99편 · 데살로니가전서 1:1-10</p><p><b>마지막 선포</b><br>황제의 것은 황제에게, 그러나 나는 하나님께! 하나님의 형상이 새겨진 나를, 오늘 하나님께 돌려드립시다.</p>"},{"id":"p0","label":"1대지 올무 앞에서도 진실하신 주님","sub":"마태복음 22:15-18","x":1.592040838891559e-14,"y":-230,"color":"#6B4FA0","level":1,"detail":"<p><b>마태복음 22:15-18</b></p><p>첫째, 예수님은 올무 앞에서도 진실하셨습니다. 구원받은 성도는 겉과 속이 같은 사람입니다.</p>"},{"id":"p0k0","label":"마태복음 22:15-18","sub":"본문","x":-284.99999999999994,"y":-420,"color":"#6B4FA0","level":2,"detail":"<p>15 그 때에 바리새파 사람들이 나가서, 어떻게 하면 말로 예수를 올무에 걸리게 할까 의논하였다.<br>16 그런 다음에, 그들은 자기네 제자들을 헤롯 당원들과 함께 예수께 보내어, 이렇게 묻게 하였다. \"선생님, 우리는, 선생님이 진실한 분이시고, 하나님의 길을 참되게 가르치시며, 아무에게도 매이지 않으시는 줄 압니다. …<br>17 그러니 선생님의 생각은 어떤지 말씀하여 주십시오. 황제에게 세금을 바치는 것이 옳습니까, 옳지 않습니까?\"<br>18 예수께서 그들의 악한 생각을 아시고 말씀하셨다. \"위선자들아, 어찌하여 나를 시험하느냐?\"</p>"},{"id":"p0k1","label":"대룡시장 두 고추 장수","sub":"예화","x":-94.99999999999997,"y":-420,"color":"#6B4FA0","level":2,"detail":"<p>교동 대룡시장에 고추를 파는 할머니 두 분이 있다고 생각해 봅시다. 한 분은 자루 위쪽에 크고 빨간 고추만 골라 얹어 놓습니다. 처음 보는 손님은 그 집 고추가 더 좋아 보여 먼저 삽니다. 다른 할머니는 위나 아래나 똑같은 고추를 담아 놓습니다. 그런데 한 해, 두 해가 지나면 어떻게 될까요? 위만 번듯한 집은 손님이 한 번 사 가고 다시 오지 않습니다. 겉과 속이 같은 집에는 단골이 줄을 섭니다. 사람들은 결국 압니다. 겉과 속이 다른 것, 그것이 위선입니다. 겉과 속이 같은 것, 그것이 진실입니다. 예수님은 바로 그 진실 자체이신 분이시고, 우리를 그 진실함으로 부르십니다.</p>"},{"id":"p0k2","label":"표준설교 2편 「거의 그리스도인」","sub":"웨슬리","x":95.00000000000003,"y":-420,"color":"#6B4FA0","level":2,"detail":"<p><i>By sincerity I mean, a real design to serve God, a hearty desire to do his will.</i></p><p>제가 말하는 신실함이란, 하나님을 섬기려는 진짜 뜻이요, 그분의 뜻을 행하려는 마음 깊은 소원입니다.</p><p>웨슬리는 겉모양은 그리스도인 같지만 속은 아닌 사람을 \"거의 그리스도인\"이라 불렀습니다. 바리새인들은 성경도 알고 예의도 갖췄지만 \"진짜 뜻\"이 없었습니다. 구원받은 성도는 겉모양이 아니라 마음 중심이 하나님을 향한 사람입니다.</p>"},{"id":"p0k3","label":"이번 주 실천","sub":"적용","x":285.00000000000006,"y":-420,"color":"#6B4FA0","level":2,"detail":"<ul><li>이번 주, 말을 꺼내기 전에 한 번 멈추어 \"이 말이 내 속마음과 같은가?\" 스스로 물어보십시오.</li><li>잠자리에 들기 전 꾸민 기도 대신 \"주님, 오늘 저는 사실 이랬습니다\" 하고 솔직한 기도 한 마디를 드리십시오.</li></ul>"},{"id":"p1","label":"2대지 누구의 형상이 새겨져 있습니까","sub":"마태복음 22:19-21","x":225.16660498395407,"y":114.99999999999999,"color":"#1F8A8A","level":1,"detail":"<p><b>마태복음 22:19-21</b></p><p>둘째, 동전에는 황제의 얼굴이, 우리에게는 하나님의 얼굴이 새겨져 있습니다. 황제에게는 동전을, 하나님께는 나 자신 전부를 드립니다.</p>"},{"id":"p1k0","label":"마태복음 22:19-21","sub":"본문","x":575.5127018922193,"y":74.2505179567892,"color":"#1F8A8A","level":2,"detail":"<p>19 \"세금으로 내는 돈을 나에게 보여 달라.\" 그들은 데나리온 한 닢을 예수께 가져다 드렸다.<br>20 예수께서 그들에게 물으셨다. \"이 초상은 누구의 것이며, 글자는 누구를 가리키느냐?\"<br>21 그들이 대답하였다. \"황제의 것입니다.\" 그러자 예수께서 그들에게 말씀하셨다. \"그렇다면, 황제의 것은 황제에게 돌려드리고, 하나님의 것은 하나님께 돌려드려라.\"</p>"},{"id":"p1k1","label":"볏가마니에 붙인 이름표","sub":"예화","x":480.51270189221935,"y":164.75017265226305,"color":"#1F8A8A","level":2,"detail":"<p>옛날 정미소에 벼를 맡기던 때를 떠올려 봅시다. 온 동네 볏가마니가 한 창고에 쌓이지만 아무도 걱정하지 않았습니다. 가마니마다 \"○○리 아무개 댁\" 하고 이름을 써 붙였기 때문입니다. 아무리 뒤섞여도 이름표를 보면 주인을 압니다. 그런데 어느 날 이름표가 떨어진 가마니 하나가 구석에 남아 있다고 생각해 봅시다. 쓸모없는 가마니가 된 것일까요? 아닙니다. 주인이 직접 와서 \"이건 내 것이오\" 하고 다시 이름을 써 붙이면, 그 가마니는 다시 주인의 것이 됩니다. 죄 때문에 우리 안의 하나님 형상이 흐려졌지만, 예수 그리스도께서 오셔서 \"너는 내 것이다\" 하시며 다시 이름을 새겨 주셨습니다. 이것이 구원입니다.</p>"},{"id":"p1k2","label":"표준설교 44편 「원죄」","sub":"웨슬리","x":385.51270189221935,"y":255.2498273477369,"color":"#1F8A8A","level":2,"detail":"<p><i>The great end of religion is, to renew our hearts in the image of God.</i></p><p>신앙의 가장 큰 목적은 우리 마음을 하나님의 형상으로 새롭게 하는 것입니다.</p><p>웨슬리에게 구원은 천국 입장권 한 장이 아니라, 흐려진 하나님의 형상이 다시 또렷해지는 과정이었습니다. 믿음으로 의롭다 함을 받는 순간(칭의) 다시 하나님의 것이 되고, 날마다 그분을 닮아 가며(성화) 그 형상이 회복됩니다. 손주 얼굴에 할아버지 모습이 보이듯, 성도의 얼굴에 하나님의 모습이 보이는 것, 이것이 성화입니다.</p>"},{"id":"p1k3","label":"이번 주 실천","sub":"적용","x":290.5127018922194,"y":345.7494820432107,"color":"#1F8A8A","level":2,"detail":"<ul><li>이번 주 매일 아침, 일어나 손바닥을 펴고 \"주님, 오늘 이 손과 이 하루는 주님의 것입니다\" 하고 기도하십시오.</li><li>올해 거둔 곡식이나 수입 가운데 하나님께 드릴 감사의 몫을 쓰기 전에 먼저 따로 떼어 놓으십시오.</li></ul>"},{"id":"p2","label":"3대지 주님의 얼굴이 함께 가는 삶, 소문나는 믿음","sub":"출애굽기 33:14-16 · 데살로니가전서 1:3, 8-9","x":-225.16660498395407,"y":114.99999999999999,"color":"#D9771E","level":1,"detail":"<p><b>출애굽기 33:14-16 · 데살로니가전서 1:3, 8-9</b></p><p>셋째, 주님의 얼굴과 함께 걷는 공동체의 믿음은 숨길 수 없습니다. 반드시 각처에 소문이 납니다.</p>"},{"id":"p2k0","label":"출애굽기 33:14-16 · 데살로니가전서 1:3, 8-9","sub":"본문","x":-290.5127018922194,"y":345.7494820432107,"color":"#D9771E","level":2,"detail":"<p>출 33:14 주님께서 말씀하셨다. \"내가 친히 너와 함께 가겠다. 그리하여 네가 안전하게 하겠다.\"<br>출 33:16 … \"주님께서 우리와 함께 가셔야만, 나와 주님의 백성이 땅 위에 있는 모든 백성과 구별되는 것이 아닙니까?\"<br>살전 1:3 … 여러분의 믿음의 행위와 사랑의 수고와 … 소망의 인내를 기억하고 있습니다.<br>살전 1:8 … 하나님을 믿는 여러분의 믿음에 대한 소문이 각처에 퍼졌습니다.<br>살전 1:9 … 여러분이 어떻게 우상을 버리고 하나님께로 돌아와서, 살아 계시고 참되신 하나님을 섬기게 되었는지를, 그들은 이야기합니다.</p>"},{"id":"p2k1","label":"보리차 한 잔의 소문","sub":"예화","x":-385.51270189221935,"y":255.2498273477369,"color":"#D9771E","level":2,"detail":"<p>어느 가을날, 북녘 땅을 보려고 교동을 찾은 젊은 여행객이 길을 잃었다고 생각해 봅시다. 다리도 아프고 날도 저물어 막막할 때, 교회 앞 텃밭에서 일하시던 권사님 한 분이 \"아이고, 어디서 왔수? 앉아서 보리차라도 한 잔 하고 가요\" 하십니다. 길을 일러 주시고, 헤어질 때 \"하나님이 지켜 주실 거요\" 한마디를 덧붙이십니다. 그 여행객은 교회에 다니지 않는 사람이었습니다. 그런데 집에 돌아가 친구들에게 이렇게 말합니다. \"교동에 갔더니 교회 다니는 할머니가 그렇게 따뜻하더라.\" 큰 전도 집회가 아니라 보리차 한 잔이 복음의 소문이 되었습니다. 데살로니가 교회의 믿음이 바로 이렇게 퍼져 나갔습니다.</p>"},{"id":"p2k2","label":"「찬송과 거룩한 시」 서문","sub":"웨슬리","x":-480.51270189221935,"y":164.75017265226305,"color":"#D9771E","level":2,"detail":"<p><i>The gospel of Christ knows of no religion, but social; no holiness but social holiness.</i></p><p>그리스도의 복음은 이웃과 더불어 사는 신앙 외에 다른 신앙을 알지 못하며, 이웃과 더불어 이루는 거룩 외에 다른 거룩을 알지 못합니다.</p><p>웨슬리에게 거룩은 골방에만 갇혀 있는 것이 아니었습니다. 하나님과 함께 걷는 사람은 이웃 속에서 그 거룩이 드러납니다. 모세가 구한 \"주님의 동행\"과 데살로니가 교회의 \"소문난 믿음\"은 하나입니다. 주님과 함께 걸으면, 그 발자국이 이웃의 마을에 남습니다.</p>"},{"id":"p2k3","label":"이번 주 실천","sub":"적용","x":-575.5127018922193,"y":74.2505179567892,"color":"#D9771E","level":2,"detail":"<ul><li>이번 주 이웃 한 분을 정해, 햅쌀 한 봉지나 따뜻한 안부 전화로 \"하나님이 함께하십니다\"라는 마음을 전하십시오.</li><li>매일 정오, 1분 동안 \"주님, 오늘도 함께 가 주십시오\" 기도하고, 북녘 땅을 바라보며 평화를 위해 한 줄 기도를 더하십시오.</li></ul>"}];const edges=[["c","p0"],["p0","p0k0"],["p0","p0k1"],["p0","p0k2"],["p0","p0k3"],["c","p1"],["p1","p1k0"],["p1","p1k1"],["p1","p1k2"],["p1","p1k3"],["c","p2"],["p2","p2k0"],["p2","p2k1"],["p2","p2k2"],["p2","p2k3"]];
const NS="http://www.w3.org/2000/svg",vp=document.getElementById("vp"),svg=document.getElementById("svg");
const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
let view={x:0,y:0,k:1};
function fit(){const r=svg.getBoundingClientRect();const k=Math.min(r.width/1400,r.height/1100,1.2);view={x:r.width/2,y:r.height/2,k};apply()}
function apply(){vp.setAttribute("transform","translate("+view.x+","+view.y+") scale("+view.k+")")}
const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e};
edges.forEach(([a,b])=>{const A=byId[a],B=byId[b];vp.appendChild(el("line",{x1:A.x,y1:A.y,x2:B.x,y2:B.y,stroke:B.color,"stroke-width":B.level===1?3:1.5,"stroke-opacity":.6}))});
nodes.forEach(n=>{const g=el("g",{class:"node l"+(n.level||0),"data-id":n.id});
 const w=n.level===2?176:n.level===1?250:230,h=n.level===2?46:n.level===1?56:66;
 const lab=n.label.length>(n.level===2?11:16)&&n.level!==0?n.label.slice(0,n.level===2?11:16)+"…":n.label;
 g.appendChild(el("rect",{x:n.x-w/2,y:n.y-h/2,width:w,height:h,rx:12,fill:n.color,stroke:n.color}));
 const t=el("text",{x:n.x,y:n.y-3,"text-anchor":"middle","font-weight":n.level===2?400:700});t.textContent=lab;g.appendChild(t);
 const s=el("text",{x:n.x,y:n.y+15,"text-anchor":"middle",class:"sub"});s.textContent=n.sub;g.appendChild(s);
 g.addEventListener("click",e=>{e.stopPropagation();show(n)});vp.appendChild(g)});
const pop=document.getElementById("pop");
function show(n){pop.querySelector("h2").textContent=n.label;pop.querySelector(".body").innerHTML=n.detail;pop.style.display="block";
 const root=n.id==="c"?null:n.id.slice(0,2);document.querySelectorAll(".node").forEach(g=>{const id=g.dataset.id;g.classList.toggle("dim",!!root&&id!=="c"&&!id.startsWith(root))})}
pop.querySelector(".x").onclick=()=>{pop.style.display="none";document.querySelectorAll(".node").forEach(g=>g.classList.remove("dim"))};
let drag=null;const pts=new Map();
svg.addEventListener("pointerdown",e=>{pts.set(e.pointerId,e);if(pts.size===1)drag={x:e.clientX-view.x,y:e.clientY-view.y};svg.setPointerCapture(e.pointerId)});
svg.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;
 if(pts.size===2){const [a,b]=[...pts.values()];const d0=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);pts.set(e.pointerId,e);const [c,d]=[...pts.values()];const d1=Math.hypot(c.clientX-d.clientX,c.clientY-d.clientY);if(d0)zoom(d1/d0,(c.clientX+d.clientX)/2,(c.clientY+d.clientY)/2);return}
 pts.set(e.pointerId,e);if(drag){view.x=e.clientX-drag.x;view.y=e.clientY-drag.y;apply()}});
const up=e=>{pts.delete(e.pointerId);drag=null;if(pts.size===1){const p=[...pts.values()][0];drag={x:p.clientX-view.x,y:p.clientY-view.y}}};
svg.addEventListener("pointerup",up);svg.addEventListener("pointercancel",up);
function zoom(f,cx,cy){const r=svg.getBoundingClientRect();cx-=r.left;cy-=r.top;const k=Math.max(.3,Math.min(3,view.k*f));f=k/view.k;view.x=cx-(cx-view.x)*f;view.y=cy-(cy-view.y)*f;view.k=k;apply()}
svg.addEventListener("wheel",e=>{e.preventDefault();zoom(e.deltaY<0?1.1:1/1.1,e.clientX,e.clientY)},{passive:false});
addEventListener("resize",fit);fit();
</script></body></html>
