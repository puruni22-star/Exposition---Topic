<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스트롱 코드 사전</title>
<style>
:root{
  --bg:#f7f4ee; --card:#ffffff; --ink:#1f2328; --muted:#5f6672; --line:#e3ddd2;
  --accent:#7a3e1d; --accent-soft:#f3e6da; --heb:#1d4e7a; --grk:#2f6b3a; --mark:#fff3b0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181c; --card:#1f2228; --ink:#e8e6e1; --muted:#a2a8b3; --line:#343841;
    --accent:#e0a07a; --accent-soft:#3a2a20; --heb:#8cbcf0; --grk:#93d19f; --mark:#5a4b10;
  }
}
:root[data-theme="dark"]{
  --bg:#16181c; --card:#1f2228; --ink:#e8e6e1; --muted:#a2a8b3; --line:#343841;
  --accent:#e0a07a; --accent-soft:#3a2a20; --heb:#8cbcf0; --grk:#93d19f; --mark:#5a4b10;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-size:19px;line-height:1.65}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
.bar{max-width:860px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1{font-size:20px;margin:0 12px 0 0;color:var(--accent);white-space:nowrap}
form{display:flex;gap:8px;flex:1;min-width:240px}
input[type=search]{flex:1;min-width:0;font-size:20px;padding:8px 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input[type=search]:focus{outline:none;border-color:var(--accent)}
button{font-size:18px;padding:8px 14px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer;font-family:inherit}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
main{max-width:860px;margin:0 auto;padding:16px}
.hint{color:var(--muted);font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:0 0 16px}
.card.heb{border-left:6px solid var(--heb)}
.card.grk{border-left:6px solid var(--grk)}
.code{font-weight:700;font-size:18px}
.heb .code{color:var(--heb)} .grk .code{color:var(--grk)}
.tag{display:inline-block;font-size:14px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:2px}
.lemma{font-size:40px;line-height:1.3;margin:6px 0 2px;font-family:"SBL Hebrew","SBL Greek","Ezra SIL","Times New Roman",serif}
.lemma.he{direction:rtl;text-align:left;unicode-bidi:plaintext}
.xlit{color:var(--muted);font-size:18px}
dl{margin:12px 0 0;display:grid;grid-template-columns:7.5em 1fr;gap:6px 12px}
dt{color:var(--muted);font-size:16px;padding-top:2px}
dd{margin:0;word-break:break-word}
a.ref{color:var(--accent);font-weight:600;text-decoration:none;border-bottom:1px dashed currentColor;cursor:pointer}
.ext{margin-top:12px;font-size:15px;color:var(--muted)}
.ext a{color:var(--muted);margin-right:12px}
.notfound{color:var(--muted)}
#history{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
#history a{font-size:15px;padding:2px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;cursor:pointer}
footer{max-width:860px;margin:24px auto;padding:0 16px;color:var(--muted);font-size:13px}
@media (max-width:560px){
  body{font-size:17px} h1{font-size:18px} .lemma{font-size:34px}
  dl{grid-template-columns:1fr} dt{padding-top:6px}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>📖 스트롱 코드 사전</h1>
    <form id="f" autocomplete="off">
      <input id="q" type="search" placeholder="예: H1254, G3056, 1254" aria-label="스트롱 코드">
      <button type="submit">찾기</button>
    </form>
    <button class="ghost" id="theme" type="button" title="밝게/어둡게">🌓</button>
  </div>
</header>
<main>
  <div id="out"></div>
  <div class="card" id="histCard" hidden>
    <div class="hint">최근 찾아본 코드</div>
    <div id="history"></div>
  </div>
</main>
<footer>
  사전 자료: James Strong, <i>Strong's Exhaustive Concordance</i> (1890) 히브리어·헬라어 사전 —
  Open Scriptures JSON판 (CC-BY-SA). 히브리어 8,674단어 · 헬라어 5,523단어 수록. 인터넷 없이 동작합니다.
</footer>
<script>
var HEB = /*__HEB__*/null;
var GRK = /*__GRK__*/null;

var LABEL = {
  lemma:"원어", xlit:"음역", translit:"음역", pron:"발음", derivation:"어원",
  strongs_def:"스트롱 정의", kjv_def:"KJV 번역례"
};

// "H1254", "h 1254", "<1254>", "1254", "G3056", "히1254", "헬 3056", "H01254" 등 모두 인식
function parseCode(raw){
  if(raw == null) return null;
  var s = String(raw);
  try{ s = decodeURIComponent(s); }catch(e){}
  s = s.replace(/^[#?]/,"").replace(/^q=/i,"").trim();
  var m = s.match(/^[<\[(（{]?\s*(H|G|히|헬|HEB|GRK|GK)?\s*[-:.]?\s*0*(\d{1,5})\s*[A-Za-z]?\s*[>\])）}]?\s*[.,;:]?$/i);
  if(!m) return null;
  var p = (m[1]||"").toUpperCase(), n = parseInt(m[2],10);
  if(!n) return null;
  var lang = (p==="H"||p==="히"||p==="HEB") ? "H" : (p==="G"||p==="헬"||p==="GRK"||p==="GK") ? "G" : "";
  return {lang:lang, num:n};
}

function esc(t){ return String(t==null?"":t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }
function linkify(t){
  return esc(t).replace(/\b([HG])(\d{1,5})\b/g,function(_,l,n){ return '<a class="ref" data-code="'+l+n+'">'+l+n+'</a>'; });
}

function card(lang, num){
  var key = lang+num, d = (lang==="H"?HEB:GRK)[key];
  var cls = lang==="H" ? "heb" : "grk", name = lang==="H" ? "히브리어 (구약)" : "헬라어 (신약)";
  if(!d) return '<div class="card '+cls+'"><span class="code">'+key+'</span><span class="tag">'+name+'</span>'+
                '<p class="notfound">이 번호는 '+name+' 사전에 없습니다.</p></div>';
  var h = '<div class="card '+cls+'" data-key="'+key+'"><span class="code">'+key+'</span><span class="tag">'+name+'</span>';
  h += '<div class="lemma'+(lang==="H"?" he":"")+'">'+esc(d.lemma)+'</div>';
  var xl = d.xlit || d.translit;
  h += '<div class="xlit">'+esc(xl||"")+(d.pron?' · ['+esc(d.pron)+']':'')+'</div><dl>';
  ["strongs_def","kjv_def","derivation"].forEach(function(k){
    if(d[k] && String(d[k]).trim()) h += '<dt>'+LABEL[k]+'</dt><dd>'+linkify(String(d[k]).trim())+'</dd>';
  });
  h += '</dl><div class="ext">온라인 더보기: '+
    '<a target="_blank" rel="noopener" href="https://biblehub.com/'+(lang==="H"?"hebrew":"greek")+'/'+num+'.htm">BibleHub</a>'+
    '<a target="_blank" rel="noopener" href="https://www.blueletterbible.org/lexicon/'+key.toLowerCase()+'/kjv/">Blue Letter Bible</a></div></div>';
  return h;
}

var current = "";
function show(raw, fromHash){
  var out = document.getElementById("out"), c = parseCode(raw);
  if(!c){
    out.innerHTML = raw && String(raw).trim()
      ? '<div class="card"><p class="notfound">“'+esc(raw)+'”은(는) 스트롱 코드 형식이 아닙니다.<br>예: H1254 (히브리어), G3056 (헬라어), 또는 숫자만 1254</p></div>'
      : '<div class="card"><p class="hint">원어성경연구 프로그램에서 스트롱 코드 번호를 <b>더블 클릭</b>하면 이 창에 뜻이 자동으로 나타납니다.<br>여기에 직접 입력해서 찾을 수도 있습니다. (예: H1254, G3056)</p></div>';
    document.title = "스트롱 코드 사전";
    return;
  }
  var html = "", label;
  if(c.lang){ html = card(c.lang, c.num); label = c.lang + c.num; }
  else {
    // 접두어 없이 숫자만 온 경우: 히브리어·헬라어 둘 다 보여 줌
    label = String(c.num);
    var hasH = HEB["H"+c.num], hasG = GRK["G"+c.num];
    html = '<p class="hint">숫자만 입력되어 히브리어(구약)와 헬라어(신약)를 함께 보여 드립니다.</p>';
    if(hasH) html += card("H", c.num);
    if(hasG) html += card("G", c.num);
    if(!hasH && !hasG) html += card("H", c.num);
  }
  out.innerHTML = html;
  document.getElementById("q").value = label;
  document.title = label + " - 스트롱 코드 사전";
  current = label;
  if(!fromHash && location.hash.slice(1) !== label){ try{ history.replaceState(null,"","#"+label); }catch(e){} }
  addHistory(label);
  window.scrollTo(0,0);
}

function loadHist(){ try{ return JSON.parse(localStorage.getItem("strongsHist")||"[]"); }catch(e){ return []; } }
function addHistory(code){
  var h = loadHist().filter(function(x){return x!==code;}); h.unshift(code); h = h.slice(0,20);
  try{ localStorage.setItem("strongsHist", JSON.stringify(h)); }catch(e){}
  renderHist(h);
}
function renderHist(h){
  var box = document.getElementById("history"), cardEl = document.getElementById("histCard");
  cardEl.hidden = h.length < 2;
  box.innerHTML = h.map(function(x){ return '<a data-code="'+esc(x)+'">'+esc(x)+'</a>'; }).join("");
}

function fromLocation(){
  var q = "";
  var sm = location.search.match(/[?&]q=([^&]*)/);
  if(location.hash.length > 1) q = location.hash.slice(1);
  else if(sm) q = sm[1];
  show(q, true);
}

document.getElementById("f").addEventListener("submit", function(e){ e.preventDefault(); show(document.getElementById("q").value); });
document.addEventListener("click", function(e){
  var a = e.target.closest && e.target.closest("a[data-code]");
  if(a){ e.preventDefault(); show(a.getAttribute("data-code")); }
});
window.addEventListener("hashchange", fromLocation);
document.getElementById("theme").addEventListener("click", function(){
  var r = document.documentElement, dark = r.getAttribute("data-theme")
    ? r.getAttribute("data-theme")==="dark"
    : window.matchMedia("(prefers-color-scheme: dark)").matches;
  var t = dark ? "light" : "dark"; r.setAttribute("data-theme", t);
  try{ localStorage.setItem("strongsTheme", t); }catch(e){}
});
try{ var th = localStorage.getItem("strongsTheme"); if(th) document.documentElement.setAttribute("data-theme", th); }catch(e){}
renderHist(loadHist());
fromLocation();
</script>
</body>
</html>
