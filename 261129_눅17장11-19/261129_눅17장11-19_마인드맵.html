<script>
const nodes=[{"id":"c","label":"돌아와 감사한 사람","sub":"누가복음 17:11-19","x":0,"y":0,"r":0,"color":"#1B3A6B","detail":"<p><b>열 사람은 고침을 받았고, 한 사람은 구원을 받았습니다</b></p><p>2026년 11월 29일 (주일) · 지석교회 추수감사주일 · 대림절 첫째 주일</p><p>누가복음 17:11-19<br>신명기 8:7-18 · 시편 65:9-13</p><p><b>마지막 선포</b><br>은혜는 모두에게 임했지만, 구원은 돌아온 사람이 받았습니다. 오늘, 우리가 그 한 사람이 됩시다!</p>"},{"id":"p0","label":"1대지 은혜는 먼저, 모두에게 임했습니다","sub":"누가복음 17:11-14 · 시편 65:9-11","x":1.592040838891559e-14,"y":-230,"color":"#6B4FA0","level":1,"detail":"<p><b>누가복음 17:11-14 · 시편 65:9-11</b></p><p>첫째, 은혜는 먼저, 모두에게 임했습니다. 올해 우리가 거둔 모든 것은 우리가 구하기 전에 하나님께서 먼저 열어 주신 물꼬입니다.</p>"},{"id":"p0k0","label":"누가복음 17:11-14 · 시편 65:9-11","sub":"본문","x":-284.99999999999994,"y":-420,"color":"#6B4FA0","level":2,"detail":"<p>눅 17:11 예수께서 예루살렘으로 가시는 길에, 사마리아와 갈릴리 사이로 지나가셨다.<br>12 예수께서 어떤 마을에 들어가시다가, 나병환자 열 사람을 만나셨다. 그들은 멀찍이 멈추어 서서,<br>13 소리를 높여 말하였다. \"예수 선생님, 우리에게 자비를 베풀어 주십시오.\"<br>14 예수께서는 그들을 보시고 \"가서, 제사장들에게 너희 몸을 보여라\" 하고 말씀하셨다. 그런데 그들이 가는 동안에 몸이 깨끗해졌다.<br>시 65:9 주님께서 땅을 돌보시어, 물을 대주시고, 큰 풍년이 들게 해주십니다. …<br>시 65:11 주님께서 큰 복을 내리시어, 한 해를 이처럼 영광스럽게 꾸미시니, 주님께서 지나시는 자취마다, 기름이 뚝뚝 떨어집니다.</p>"},{"id":"p0k1","label":"새벽에 열려 있던 물꼬","sub":"예화","x":-94.99999999999997,"y":-420,"color":"#6B4FA0","level":2,"detail":"<p>어느 해 여름, 가뭄이 길어 논바닥이 갈라지던 때를 떠올려 봅시다. 한 농부가 새벽 일찍 \"오늘은 꼭 물을 대야지\" 하고 삽을 메고 논에 나갔습니다. 그런데 가 보니 이미 물꼬가 터져 있고, 논에 물이 찰랑찰랑 차 있었습니다. 알고 보니 옆 논의 이웃 어른이 새벽 네 시에 나와 자기 논에 물을 대면서, 혹시나 하고 이웃 논 물꼬까지 열어 놓고 간 것이었습니다. 농부가 한 일이라고는 아침에 나가서 \"아, 물이 들어왔구나\" 하고 본 것뿐입니다. 성도 여러분, 우리 신앙이 꼭 이렇습니다. 우리가 하나님을 찾아 나서기 전에, 하나님은 이미 새벽에 먼저 나오셔서 우리 삶의 물꼬를 열어 놓으셨습니다. 올해 우리 논에 들어온 물, 우리 몸에 남아 있는 건강, 우리 가정에 허락된 평안은 모두 그 \"먼저 열린 물꼬\"입니다. 감사는 거기서 시작됩니다. \"내가 했다\"가 아니라 \"이미 열려 있었구나\" 하는 깨달음에서 말입니다.</p>"},{"id":"p0k2","label":"표준설교 85편 「우리 자신의 구원을 이루라」","sub":"웨슬리","x":95.00000000000003,"y":-420,"color":"#6B4FA0","level":2,"detail":"<p><i>Salvation begins with what is usually termed (and very properly) preventing grace; including the first wish to please God, the first dawn of light concerning his will.</i></p><p>구원은 흔히 (그리고 아주 적절하게) '먼저 오는 은혜'라고 불리는 것에서 시작됩니다. 하나님을 기쁘시게 하고 싶은 첫 소원, 그분의 뜻을 향한 첫 새벽빛이 모두 그 은혜입니다.</p><p>웨슬리는 \"선행은총(先行恩寵)\", 곧 우리가 하나님을 찾기 전에 하나님이 먼저 우리를 찾아오시는 은혜를 강조했습니다. 열 사람이 예수님을 부를 수 있었던 것도, 그 마을 어귀를 예수님이 먼저 지나가셨기 때문입니다. 한 해의 수확도, 오늘 예배에 나오고 싶은 마음도 모두 먼저 오신 하나님의 은혜입니다.</p>"},{"id":"p0k3","label":"이번 주 실천","sub":"적용","x":285.00000000000006,"y":-420,"color":"#6B4FA0","level":2,"detail":"<ul><li>이번 주 하루 10분을 떼어, 종이에 \"올해 하나님이 먼저 열어 주신 물꼬\" 열 가지를 적어 보십시오. 곡식, 건강, 가족, 이웃의 도움까지 구체적으로 적으십시오.</li><li>식사 때마다 \"주님께서 이 땅을 돌보셨습니다\" 한마디를 덧붙여 감사 기도를 드리십시오.</li></ul>"},{"id":"p1","label":"2대지 한 사람이 돌아왔습니다","sub":"누가복음 17:15-16 · 신명기 8:10-14, 17-18","x":225.16660498395407,"y":114.99999999999999,"color":"#1F8A8A","level":1,"detail":"<p><b>누가복음 17:15-16 · 신명기 8:10-14, 17-18</b></p><p>둘째, 한 사람이 돌아왔습니다. 감사는 선물에 머물지 않고 선물을 주신 분께로 발걸음을 돌리는 것이며, 풍요 속에서 하나님을 기억하는 것입니다.</p>"},{"id":"p1k0","label":"누가복음 17:15-16 · 신명기 8:10-14, 17-18","sub":"본문","x":575.5127018922193,"y":74.2505179567892,"color":"#1F8A8A","level":2,"detail":"<p>눅 17:15 그런데 그들 가운데 한 사람은 자기의 병이 나은 것을 보고, 큰소리로 하나님을 찬양하면서 되돌아와서,<br>16 예수의 발 아래에 엎드려 감사를 드렸다. 그런데 그는 사마리아 사람이었다.<br>신 8:10 당신들은 배불리 먹고, 좋은 땅을 주신 주 당신들의 하나님을 찬양하게 될 것입니다.<br>신 8:11 당신들은 주 당신들의 하나님을 잊지 않도록 주의하십시오. …<br>신 8:17 당신들이 마음속으로 '이 재물은 내 능력과 내 손의 힘으로 모은 것이다' 하고 생각할 수도 있으나,<br>신 8:18 당신들의 하나님이신 주님을 기억하십시오. 당신들에게 재산을 모으는 힘을 주신 분이 바로 주님이십니다.</p>"},{"id":"p1k1","label":"서울 간 아들의 전화 한 통","sub":"예화","x":480.51270189221935,"y":164.75017265226305,"color":"#1F8A8A","level":2,"detail":"<p>교동의 한 어머니가 가을걷이를 끝내고 햅쌀을 찧어 서울 사는 자녀 넷에게 한 포대씩 택배로 부쳤다고 생각해 봅시다. 허리가 아파도 \"우리 애들 햅쌀밥 먹이고 싶어서\" 하며 직접 포장하고 주소를 쓰셨습니다. 며칠 뒤 택배 회사에서 \"모두 배송 완료\" 문자가 옵니다. 쌀은 네 집에 다 잘 도착했습니다. 그런데 그날 밤, 전화가 온 것은 막내딸 한 명뿐이었습니다. \"엄마, 쌀 잘 받았어. 밥 해 먹었는데 정말 맛있어. 허리 아픈데 이걸 어떻게 다 했어. 고마워, 엄마.\" 쌀은 네 집이 똑같이 받았습니다. 그러나 그날 밤 어머니의 마음을 받은 사람은 막내 한 명뿐입니다. 나머지 셋도 쌀밥은 맛있게 먹었을 것입니다. 그러나 쌀만 받고 어머니는 만나지 못했습니다. 감사는 선물을 받는 것이 아니라, 선물을 보낸 분께 \"돌아가는\" 것입니다. 오늘 하나님 아버지께서도 기다리십니다. 우리 집에 도착한 한 해의 은혜를 보시고 \"잘 받았습니다, 아버지\" 하는 그 전화 한 통을 말입니다.</p>"},{"id":"p1k2","label":"표준설교 1편 「믿음에 의한 구원」","sub":"웨슬리","x":385.51270189221935,"y":255.2498273477369,"color":"#1F8A8A","level":2,"detail":"<p><i>All the blessings which God hath bestowed upon man are of his mere grace, bounty, or favour; his free, undeserved favour.</i></p><p>하나님께서 사람에게 주신 모든 복은 오직 그분의 은혜와 너그러우심과 호의에서 나온 것입니다. 값없이 주신, 받을 자격 없는 자에게 주신 호의입니다.</p><p>웨슬리는 감리교 설교집의 첫 설교 첫 문장을 이렇게 시작했습니다. 받은 복이 \"자격 없는 자에게 주신 은혜\"임을 아는 사람만이 진심으로 감사할 수 있습니다. 사마리아 사람은 자신이 받을 자격이 없다는 것을 알았기에 돌아왔고, 아홉은 \"내가 당연히 받을 것을 받았다\"고 여겼기에 돌아오지 않았습니다. \"내 손의 힘\"(신 8:17)이 아니라 \"주님의 은혜\"를 고백하는 것, 그것이 감사의 출발입니다.</p>"},{"id":"p1k3","label":"이번 주 실천","sub":"적용","x":290.5127018922194,"y":345.7494820432107,"color":"#1F8A8A","level":2,"detail":"<ul><li>이번 주, 1대지에서 적은 \"은혜 목록\" 가운데 하나를 골라 하나님께 \"잘 받았습니다, 아버지\" 하고 소리 내어 감사 기도를 드리십시오.</li><li>올해 나를 도와준 사람 한 명(이웃, 자녀, 면사무소 직원, 농기계 고쳐 준 사람 등)에게 전화나 찾아감으로 \"고맙습니다\"를 직접 전하십시오.</li></ul>"},{"id":"p2","label":"3대지 일어나 가라, 네 믿음이 너를 구원하였다","sub":"누가복음 17:17-19","x":-225.16660498395407,"y":114.99999999999999,"color":"#D9771E","level":1,"detail":"<p><b>누가복음 17:17-19</b></p><p>셋째, 돌아온 사람은 구원을 얻고 다시 일어나 갑니다. 감사는 고침을 구원으로 완성하고, 우리를 이웃에게로 보냅니다.</p>"},{"id":"p2k0","label":"누가복음 17:17-19","sub":"본문","x":-290.5127018922194,"y":345.7494820432107,"color":"#D9771E","level":2,"detail":"<p>17 예수께서는 말씀하셨다. \"열 사람이 깨끗해지지 않았느냐? 그런데 아홉은 어디에 있느냐?<br>18 이 이방 사람 말고는 하나님께 영광을 돌리러 되돌아온 사람이 아무도 없단 말이냐?\"<br>19 그런 다음에, 그에게 말씀하셨다. \"일어나서 가거라. 네 믿음이 너를 구원하였다.\"</p>"},{"id":"p2k1","label":"이삭을 남겨 둔 할아버지","sub":"예화","x":-385.51270189221935,"y":255.2498273477369,"color":"#D9771E","level":2,"detail":"<p>어릴 적 시골에서 이런 할아버지를 본 적이 있으실 겁니다. 벼를 벨 때 논 가장자리 한 줄은 일부러 남겨 두시고, 떨어진 이삭도 다 줍지 않으십니다. 손주가 \"할아버지, 저기 아직 남았어요\" 하면 웃으며 말씀하십니다. \"그건 새들 몫이고, 이삭 주우러 오는 사람 몫이다. 하나님이 다 우리 먹으라고 주신 게 아니란다.\" 레위기 19장과 룻기에 나오는 이삭줍기의 정신이 우리 옛 어른들의 손에 그대로 남아 있었던 것입니다. 성도 여러분, 그 할아버지의 곳간은 남겨 둔 이삭만큼 비었을까요? 아닙니다. 그분의 곳간은 오히려 감사로 가득했고, 그 집 마당에는 늘 사람이 모였습니다. 은혜를 받은 줄 아는 사람은 움켜쥐지 않습니다. 하나님께 돌아와 감사한 사람은 반드시 이웃에게로 \"일어나 갑니다\". 받은 은혜가 손을 통해 흘러갈 때, 감사는 비로소 완성됩니다.</p>"},{"id":"p2k2","label":"표준설교 50편 「돈의 사용」","sub":"웨슬리","x":-480.51270189221935,"y":164.75017265226305,"color":"#D9771E","level":2,"detail":"<p><i>Having, first, gained all you can, and, secondly, saved all you can, then give all you can.</i></p><p>첫째, 할 수 있는 한 정직하게 벌고, 둘째, 할 수 있는 한 아끼고, 그다음에는 할 수 있는 한 나누십시오.</p><p>웨슬리는 우리가 가진 모든 것이 하나님께 맡겨진 것이며, 우리는 그것을 관리하는 청지기라고 가르쳤습니다. 감사는 입술로만 끝나지 않고, 받은 것을 이웃과 나누는 손으로 완성됩니다. 웨슬리안 전통은 이것을 \"사회적 성화\"라 부릅니다. 하나님께 돌아온 사람은 반드시 이웃에게로 나아갑니다.</p>"},{"id":"p2k3","label":"이번 주 실천","sub":"적용","x":-575.5127018922193,"y":74.2505179567892,"color":"#D9771E","level":2,"detail":"<ul><li>이번 주 햅쌀이나 김장 김치 한 통, 또는 따뜻한 안부 한 마디를 \"남겨 둔 이삭\"으로 정해, 홀로 계신 이웃 한 분께 가져다 드리십시오.</li><li>매일 저녁 잠들기 전 \"오늘 감사한 일 세 가지\"를 하나님께 말씀드리고, 북녘 땅의 형제들에게도 추수의 기쁨이 있기를 한 줄 기도하십시오.</li></ul>"}];const edges=[["c","p0"],["p0","p0k0"],["p0","p0k1"],["p0","p0k2"],["p0","p0k3"],["c","p1"],["p1","p1k0"],["p1","p1k1"],["p1","p1k2"],["p1","p1k3"],["c","p2"],["p2","p2k0"],["p2","p2k1"],["p2","p2k2"],["p2","p2k3"]];
const NS="http://www.w3.org/2000/svg",vp=document.getElementById("vp"),svg=document.getElementById("svg");
const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
let view={x:0,y:0,k:1};
function fit(){const r=svg.getBoundingClientRect();const k=Math.min(r.width/1400,r.height/1100,1.2);view={x:r.width/2,y:r.height/2,k};apply()}
function apply(){vp.setAttribute("transform","translate("+view.x+","+view.y+") scale("+view.k+")")}
const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e};
edges.forEach(([a,b])=>{const A=byId[a],B=byId[b];vp.appendChild(el("line",{x1:A.x,y1:A.y,x2:B.x,y2:B.y,stroke:B.color,"stroke-width":B.level===1?3:1.5,"stroke-opacity":.6}))});
nodes.forEach(n=>{const g=el("g",{class:"node l"+(n.level||0),"data-id":n.id});
 const w=n.level===2?176:n.level===1?250:230,h=n.level===2?46:n.level===1?56:66;
 const lab=n.label.length>(n.level===2?11:16)&&n.level!==0?n.label.slice(0,n.level===2?11:16)+"…":n.label;
 g.appendChild(el("rect",{x:n.x-w/2,y:n.y-h/2,width:w,height:h,rx:12,fill:n.color,stroke:n.color}));
 const t=el("text",{x:n.x,y:n.y-3,"text-anchor":"middle","font-weight":n.level===2?400:700});t.textContent=lab;g.appendChild(t);
 const s=el("text",{x:n.x,y:n.y+15,"text-anchor":"middle",class:"sub"});s.textContent=n.sub;g.appendChild(s);
 g.addEventListener("click",e=>{e.stopPropagation();show(n)});vp.appendChild(g)});
const pop=document.getElementById("pop");
function show(n){pop.querySelector("h2").textContent=n.label;pop.querySelector(".body").innerHTML=n.detail;pop.style.display="block";
 const root=n.id==="c"?null:n.id.slice(0,2);document.querySelectorAll(".node").forEach(g=>{const id=g.dataset.id;g.classList.toggle("dim",!!root&&id!=="c"&&!id.startsWith(root))})}
pop.querySelector(".x").onclick=()=>{pop.style.display="none";document.querySelectorAll(".node").forEach(g=>g.classList.remove("dim"))};
let drag=null;const pts=new Map();
svg.addEventListener("pointerdown",e=>{pts.set(e.pointerId,e);if(pts.size===1)drag={x:e.clientX-view.x,y:e.clientY-view.y};svg.setPointerCapture(e.pointerId)});
svg.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;
 if(pts.size===2){const [a,b]=[...pts.values()];const d0=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);pts.set(e.pointerId,e);const [c,d]=[...pts.values()];const d1=Math.hypot(c.clientX-d.clientX,c.clientY-d.clientY);if(d0)zoom(d1/d0,(c.clientX+d.clientX)/2,(c.clientY+d.clientY)/2);return}
 pts.set(e.pointerId,e);if(drag){view.x=e.clientX-drag.x;view.y=e.clientY-drag.y;apply()}});
const up=e=>{pts.delete(e.pointerId);drag=null;if(pts.size===1){const p=[...pts.values()][0];drag={x:p.clientX-view.x,y:p.clientY-view.y}}};
svg.addEventListener("pointerup",up);svg.addEventListener("pointercancel",up);
function zoom(f,cx,cy){const r=svg.getBoundingClientRect();cx-=r.left;cy-=r.top;const k=Math.max(.3,Math.min(3,view.k*f));f=k/view.k;view.x=cx-(cx-view.x)*f;view.y=cy-(cy-view.y)*f;view.k=k;apply()}
svg.addEventListener("wheel",e=>{e.preventDefault();zoom(e.deltaY<0?1.1:1/1.1,e.clientX,e.clientY)},{passive:false});
addEventListener("resize",fit);fit();
</script></body></html>
